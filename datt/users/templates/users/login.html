{% extends "users/base.html" %}
{% block title %}Đăng nhập | Nexora{% endblock %}

{% block content %}
<style>
  .auth-section {
    min-height: 80vh;
    display: grid;
    place-items: center;
    padding: 40px 0;
  }

  .auth-card {
    width: 100%;
    max-width: 440px;
    padding: 36px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid rgba(255, 0, 0, 0.18);
    box-shadow: 0 20px 45px rgba(255, 0, 0, 0.25);
    backdrop-filter: blur(10px);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 22px;
  }

  .auth-header i {
    font-size: 44px;
    color: #ff0000;
  }

  .auth-header h2 {
    margin-top: 8px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
  }

  .auth-desc {
    font-size: 14px;
    color: #b9b9b9;
  }

  .auth-card form p {
    margin-bottom: 14px;
  }

  .auth-card input[type="text"],
  .auth-card input[type="password"],
  .auth-card input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0f0f0f;
    color: #fff;
    outline: none;
    transition: 0.2s;
  }

  .auth-card input:focus {
    border-color: rgba(255, 0, 0, 0.6);
    box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.2);
  }

  .auth-card input[type="submit"] {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, #ff0000, #ff4d4d);
    border: none;
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }

  .auth-card input[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(255, 0, 0, 0.45);
  }

  .auth-links {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
  }

  .auth-links a {
    color: #ff4d4d;
    text-decoration: none;
    font-weight: 600;
  }

  .auth-links a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-section">
  <div class="auth-card">
    <div class="auth-header">
      <i class="bi bi-shield-lock-fill"></i>
      <h2>NEXORA</h2>
      <div class="auth-desc">
        Đăng nhập để truy cập hệ thống bảo mật & công nghệ
      </div>
    </div>

    <form action="{% url 'users:login' %}" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <p>
        <input type="submit" value="Đăng nhập" />
      </p>
    </form>

    <div class="auth-links">
      <p>
        <a href="{% url 'users:password_reset' %}">Quên mật khẩu?</a>
      </p>
      <p>
        Chưa có tài khoản?
        <a href="{% url 'users:register' %}">Tạo ngay</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
