{% extends "users/base.html" %}
{% block title %}Email đã được gửi - Nexora{% endblock %}

{% block content %}
<style>
  .done-wrap {
    min-height: 80vh;
    display: grid;
    place-items: center;
  }

  .done-card {
    max-width: 520px;
    width: 100%;
    padding: 34px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid rgba(255, 0, 0, 0.18);
    box-shadow: 0 20px 45px rgba(255, 0, 0, 0.25);
    text-align: center;
  }

  .done-icon {
    font-size: 56px;
    color: #ff4d4d;
  }

  .done-card h3 {
    color: #fff;
    font-weight: 700;
  }

  .done-card p {
    color: #b9b9b9;
  }
</style>

<div class="done-wrap">
  <div class="done-card">

    <div class="done-icon mb-3">
      <i class="bi bi-envelope-check-fill"></i>
    </div>

    <h3>Kiểm tra Email</h3>

    <p class="mt-2">
      Chúng tôi đã gửi hướng dẫn đặt lại mật khẩu đến địa chỉ email của bạn. Vui lòng kiểm tra hộp thư (bao gồm cả thư rác).
    </p>

    <a href="{% url 'users:login' %}" class="btn btn-danger mt-2"> Quay lại đăng nhập </a>

  </div>
</div>
{% endblock %}
