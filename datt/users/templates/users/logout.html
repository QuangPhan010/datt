{% extends "users/base.html" %}
{% block title %}Đã đăng xuất | TechStore{% endblock %}

{% block content %}
<style>
.logout-card{
  max-width:480px;
  padding:36px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 14px 40px rgba(229,57,53,.25);
  text-align:center;
}

.logout-icon{
  font-size:56px;
  color:#22c55e;
}
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height:75vh;">
  <div class="logout-card">

    <div class="logout-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3 class="mb-2">Đăng xuất thành công</h3>

    <p class="text-muted mb-4">
      Bạn đã đăng xuất khỏi
      <strong class="text-danger">TechStore</strong>.
      Hẹn gặp lại bạn!
    </p>

    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{% url 'users:login' %}" class="btn btn-danger">
        Đăng nhập lại
      </a>
      <a href="{% url 'shops:index' %}" class="btn btn-outline-danger">
        Về trang chủ
      </a>
    </div>

  </div>
</div>
{% endblock %}
