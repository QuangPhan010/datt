{% extends "users/base.html" %}
{% block title %}{{ cms.logout_title|safe }}{% endblock %}

{% block content %}
<style>
  .logout-wrap {
    min-height: 75vh;
    display: grid;
    place-items: center;
  }

  .logout-card {
    max-width: 520px;
    width: 100%;
    padding: 36px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid rgba(255, 0, 0, 0.18);
    box-shadow: 0 20px 45px rgba(255, 0, 0, 0.25);
    text-align: center;
  }

  .logout-icon {
    font-size: 58px;
    color: #22c55e;
  }

  .logout-card h3 {
    color: #fff;
    font-weight: 700;
  }

  .logout-card p {
    color: #b9b9b9;
  }
</style>

<div class="logout-wrap">
  <div class="logout-card">

    <div class="logout-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3 class="mb-2">
      <div class="cms-edit" data-page="logout" data-key="heading">
        <span class="cms-edit__content">{{ cms.logout_heading|safe }}</span>
      </div>
    </h3>

    <p class="mb-4">
      <span class="cms-edit" data-page="logout" data-key="message">
        <span class="cms-edit__content">{{ cms.logout_message|safe }}</span>
      </span>
    </p>

    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <a href="{% url 'users:login' %}" class="btn btn-danger">
        <div class="cms-edit cms-inline" data-page="logout" data-key="login_button">
          <span class="cms-edit__content">{{ cms.logout_login_button|safe }}</span>
        </div>
      </a>
      <a href="{% url 'shops:index' %}" class="btn btn-outline-danger">
        <div class="cms-edit cms-inline" data-page="logout" data-key="home_button">
          <span class="cms-edit__content">{{ cms.logout_home_button|safe }}</span>
        </div>
      </a>
    </div>

  </div>
</div>
{% endblock %}
