{% extends "users/base.html" %}
{% block title %}{{ cms.password_reset_new_title|safe }}{% endblock %}

{% block content %}
<style>
  .auth-section {
    min-height: 80vh;
    display: grid;
    place-items: center;
    padding: 40px 0;
  }

  .auth-card {
    width: 100%;
    max-width: 460px;
    padding: 36px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid rgba(255, 0, 0, 0.18);
    box-shadow: 0 20px 45px rgba(255, 0, 0, 0.25);
    backdrop-filter: blur(10px);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 22px;
  }

  .auth-header i {
    font-size: 44px;
    color: #ff0000;
  }

  .auth-header h2 {
    margin-top: 8px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 1px;
  }

  .auth-desc {
    font-size: 14px;
    color: #b9b9b9;
  }

  .auth-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0f0f0f;
    color: #fff;
    outline: none;
    transition: 0.2s;
  }

  .auth-card input:focus {
    border-color: rgba(255, 0, 0, 0.6);
    box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.2);
  }

  .auth-btn {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background: linear-gradient(45deg, #ff0000, #ff4d4d);
    border: none;
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }

  .auth-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(255, 0, 0, 0.45);
  }
</style>

<div class="auth-section">
  <div class="auth-card">

    <div class="auth-header">
      <i class="bi bi-key-fill"></i>
      <h2>
        <div class="cms-edit cms-inline" data-page="global" data-key="nav_brand">
          <span class="cms-edit__content">{{ cms.global_nav_brand|safe }}</span>
        </div>
      </h2>
      <div class="auth-desc">
        <div class="cms-edit" data-page="password_reset_new" data-key="subtitle">
          <span class="cms-edit__content">{{ cms.password_reset_new_subtitle|safe }}</span>
        </div>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="auth-btn">
        <div class="cms-edit cms-inline" data-page="password_reset_new" data-key="submit">
          <span class="cms-edit__content">{{ cms.password_reset_new_submit|safe }}</span>
        </div>
      </button>
    </form>

  </div>
</div>
{% endblock %}
