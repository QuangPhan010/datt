{% extends "users/base.html" %}
{% block title %}Đặt lại mật khẩu thành công - Nexora{% endblock %}

{% block content %}
<style>
  .done-wrap {
    min-height: 75vh;
    display: grid;
    place-items: center;
  }

  .done-card {
    max-width: 520px;
    width: 100%;
    padding: 34px;
    border-radius: 20px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid rgba(255, 0, 0, 0.18);
    box-shadow: 0 20px 45px rgba(255, 0, 0, 0.25);
    text-align: center;
  }

  .done-icon {
    font-size: 56px;
    color: #22c55e;
  }

  .done-card h4 {
    color: #fff;
    font-weight: 700;
  }

  .done-card p {
    color: #b9b9b9;
  }
</style>

<div class="done-wrap">
  <div class="done-card">

    <div class="done-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h4>Hoàn tất!</h4>

    <p class="mt-2">
      Mật khẩu của bạn đã được thay đổi thành công. Bạn có thể sử dụng mật khẩu mới để đăng nhập.
    </p>

    <a href="{% url 'users:login' %}" class="btn btn-danger mt-2"> Đăng nhập ngay </a>

  </div>
</div>
{% endblock %}
