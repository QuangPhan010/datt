{% extends "users/base.html" %}
{% block title %}Đăng ký thành công - Nexora{% endblock %}

{% block content %}
<style>
.register-done-card{
  max-width:480px;
  width:100%;
  padding:36px;
  border-radius:18px;
  text-align:center;
  background:#fff;
  box-shadow:0 14px 40px rgba(229,57,53,.25);
}

.register-done-icon{
  font-size:56px;
  color:#22c55e;
}
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="register-done-card">

    <div class="register-done-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3 class="mb-2">Chúc mừng!</h3>

    <p class="text-muted mt-2">
      Tài khoản của bạn đã được tạo thành công. Bây giờ bạn có thể đăng nhập để bắt đầu sử dụng dịch vụ.
    </p>

    <a href="{% url 'users:login' %}" class="btn btn-danger mt-3"> Đăng nhập ngay </a>

  </div>
</div>
{% endblock %}
