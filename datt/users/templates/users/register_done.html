{% extends "users/base.html" %}
{% block title %}{{ cms.register_done_title|safe }}{% endblock %}

{% block content %}
<style>
.register-done-card{
  max-width:480px;
  width:100%;
  padding:36px;
  border-radius:18px;
  text-align:center;
  background:#fff;
  box-shadow:0 14px 40px rgba(229,57,53,.25);
}

.register-done-icon{
  font-size:56px;
  color:#22c55e;
}
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="register-done-card">

    <div class="register-done-icon mb-3">
      <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3 class="mb-2">
      <div class="cms-edit" data-page="register_done" data-key="heading">
        <span class="cms-edit__content">{{ cms.register_done_heading|safe }}</span>
      </div>
    </h3>

    <p class="text-muted mt-2">
      <span class="cms-edit" data-page="register_done" data-key="message">
        <span class="cms-edit__content">{{ cms.register_done_message|safe }}</span>
      </span>
    </p>

    <a href="{% url 'users:login' %}" class="btn btn-danger mt-3">
      <div class="cms-edit cms-inline" data-page="register_done" data-key="login_button">
        <span class="cms-edit__content">{{ cms.register_done_login_button|safe }}</span>
      </div>
    </a>

  </div>
</div>
{% endblock %}
